# Publica la aplicacion en GitHub Pages en cada push a la rama principal.
# Requisitos en GitHub (una sola vez):
#   Settings > Pages > Source: GitHub Actions
#   Settings > Secrets and variables > Actions > Variables > VITE_API_URL
name: Publicar en GitHub Pages

on:
  push:
    branches: [master, main]
  # Permite ejecutarlo a mano desde la pestana Actions (Run workflow),
  # por ejemplo despues de cambiar la variable VITE_API_URL.
  workflow_dispatch:
 
# Permisos que necesita deploy-pages para publicar.
permissions:
  contents: read
  pages: write
  id-token: write
 
# Si llegan dos push seguidos, solo se publica el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
 
      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
 
      - name: Instalar dependencias
        run: npm ci
 
      - name: Compilar
        run: npm run build
        env:
          # La URL de la API se escribe dentro del .js en este paso.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Subdirectorio de Pages: el nombre de este repositorio.
          BASE_PATH: /${{ github.event.repository.name }}/
 
      - name: Copiar index.html como 404.html
        # Pages entrega 404.html ante una ruta que no es archivo.
        # Es la misma app: React Router lee la URL y dibuja la vista.
        run: cp dist/index.html dist/404.html
 
      - name: Preparar la carpeta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
 
      - name: Publicar
        id: publicacion
        uses: actions/deploy-pages@v4
